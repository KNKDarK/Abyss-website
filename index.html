<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Team Abyss. A collective forging digital experiences at the edge of the void.">
  <meta name="theme-color" content="#050508">
  <title>Team Abyss</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="loading-screen" id="loading-screen" role="status" aria-label="Loading">
    <div class="loading-symbol" aria-hidden="true">&#x25C8;</div>
    <div class="loading-text">Awaiting Abyss</div>
    <div class="loading-dots" aria-hidden="true">
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
      <div class="loading-dot"></div>
    </div>
  </div>

  <div class="cursor" role="presentation" aria-hidden="true"></div>
  <div class="cursor-dot" role="presentation" aria-hidden="true"></div>
  <div class="cursor-glow" role="presentation" aria-hidden="true"></div>

  <canvas id="particle-canvas" role="presentation" aria-hidden="true"></canvas>

  <nav class="side-nav" id="side-nav" role="navigation" aria-label="Side navigation">
    <a href="index.html" class="side-item active" data-page="index" aria-current="page">
      <span class="side-icon">&#x25C8;</span>
      <span>Home</span>
    </a>
    <a href="team.html" class="side-item" data-page="team">
      <span class="side-icon">&#x2605;</span>
      <span>Team</span>
    </a>
    <a href="projects.html" class="side-item" data-page="projects">
      <span class="side-icon">&#x2691;</span>
      <span>Projects</span>
    </a>
    <a href="extras.html" class="side-item" data-page="extras">
      <span class="side-icon">&#x25C6;</span>
      <span>Extras</span>
    </a>
  </nav>

  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <div class="nav-brand" aria-hidden="true">&#x25C8; ABYSS</div>
  </nav>

  <main>
    <section class="hero" aria-label="Hero section">
      <div class="hero-badge" aria-hidden="true">&#x25C6; Enter the Abyss &#x25C6;</div>
      <h1 class="glitch" data-text="TEAM ABYSS">TEAM ABYSS</h1>
      <p class="subtitle">We forge digital experiences at the edge of the void. Beyond the veil of reality lies the abyss — and we are its architects.</p>
      <div class="hero-actions">
        <a href="team.html" class="btn btn-primary" role="button">
          Enter the Void &#x2192;
        </a>
        <a href="projects.html" class="btn btn-outline" role="button">
          View Projects
        </a>
      </div>
    </section>
  </main>

  <button class="terminal-toggle" aria-label="Open terminal overlay" title="Open terminal (Ctrl+`)">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="4 17 10 11 4 5"></polyline>
      <line x1="12" y1="19" x2="20" y2="19"></line>
    </svg>
  </button>

  <div class="terminal-overlay" id="terminal" role="dialog" aria-label="Terminal console">
    <div class="terminal-box">
      <div class="terminal-header">
        <span aria-hidden="true">abyss://console — team terminal</span>
        <button class="terminal-close" aria-label="Close terminal">&times;</button>
      </div>
      <div class="terminal-body" id="terminal-body" role="log" aria-live="polite"></div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module" src="js/particles.js"></script>
  <script type="module" src="js/cursor.js"></script>
  <script type="module" src="js/terminal.js"></script>
  <script type="module" src="js/shared.js"></script>
</body>
</html>
